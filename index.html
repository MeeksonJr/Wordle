<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wordle Clone</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; background-color: #121213; color: white; }
        #game-board { display: grid; grid-template-rows: repeat(6, 1fr); gap: 5px; margin-bottom: 20px; }
        .row { display: grid; grid-template-columns: repeat(5, 50px); gap: 5px; }
        .cell { width: 50px; height: 50px; border: 2px solid #3a3a3c; display: flex; align-items: center; justify-content: center; font-size: 2rem; font-weight: bold; text-transform: uppercase; }
        #controls { margin-top: 20px; }
        button { padding: 10px 20px; font-size: 1rem; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Wordle</h1>
    <div id="game-board"></div>
    <div id="controls">
        <button onclick="revealWord()">Reveal Word</button>
        <button onclick="showHint()">Hint</button>
    </div>
    <script>
        const targetWord = "APPLE";
        let currentRow = 0;
        const board = document.getElementById('game-board');
        for(let i=0; i<6; i++) {
            const row = document.createElement('div'); row.className = 'row';
            for(let j=0; j<5; j++) {
                const cell = document.createElement('div'); cell.className = 'cell';
                row.appendChild(cell);
            }
            board.appendChild(row);
        }
        function revealWord() { alert("The word is: " + targetWord); }
        function showHint() { alert("Hint: It is a fruit."); }
        // Simple input listener for prototype
        document.addEventListener('keydown', (e) => {
            if (e.key.length === 1 && /^[a-zA-Z]$/.test(e.key)) {
                const cells = board.children[currentRow].children;
                for(let cell of cells) {
                    if(!cell.textContent) { cell.textContent = e.key; break; }
                }
            }
        });
    </script>
</body>
</html>
